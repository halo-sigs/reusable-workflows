name: Theme CD

on:
  workflow_call:
    inputs:
      compress-all:
        type: boolean
        required: false
        default: false
        description: Whether to compress all files in the theme directory. If false, only necessary files will be compressed.
      node-version:
        description: Node.js version.
        type: string
        required: false
        default: "20"
      pnpm-version:
        description: pnpm version.
        type: string
        required: false
        default: "10"
      needs-build:
        description: Indicates if the build should be skipped.
        type: boolean
        required: false
        default: true
      skip-appstore-release:
        description: Indicates if the appstore release should be skipped.
        type: boolean
        required: false
        default: false
      app-id:
        description: Application ID from Halo App Store.
        required: false
        type: string
        default: not-configured-app-id
      halo-backend-baseurl:
        description: Base URL of Halo App Store.
        required: false
        default: https://www.halo.run
        type: string
    secrets:
      halo-pat:
        description: Personal access token of Halo Appstore.
        required: false
jobs:
  package:
    name: Package Theme
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        if: ${{ inputs.needs-build }}
        with:
          node-version: ${{ inputs.node-version }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        if: ${{ inputs.needs-build }}
        with:
          version: ${{ inputs.pnpm-version }}
      - name: Install dependencies
        run: pnpm install
        if: ${{ inputs.needs-build }}
      - name: Build
        run: pnpm build
        if: ${{ inputs.needs-build }}
      - name: Package Theme
        run: |
          if [ "${{ inputs.compress-all }}" = "true" ]; then
            npx @halo-dev/theme-package-cli --all
          else
            npx @halo-dev/theme-package-cli
          fi
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: theme-package
          path: dist

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: theme-package
          path: dist
      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} dist/*
          
  appstore-release:
    name: App Store Release
    runs-on: ubuntu-latest
    needs: package
    if: ${{ github.event_name == 'release' && !inputs.skip-appstore-release }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: theme-package
          path: dist
      - name: Release to App Store
        uses: halo-sigs/app-store-release-action@v3
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          app-id: ${{ inputs.app-id }}
          halo-backend-baseurl: ${{ inputs.halo-backend-baseurl }}
          release-id: ${{ github.event.release.id }}
          assets-dir: dist
          halo-pat: ${{ secrets.halo-pat }}