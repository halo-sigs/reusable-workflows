name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-store-release-action:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-store-release-action
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: "12.6.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check src test
      - run: pnpm run typecheck
      - run: node --test test/*.test.mjs
      - run: node --check dist/index.js
      - run: pnpm run build
      - run: git diff --exit-code -- dist/index.js
